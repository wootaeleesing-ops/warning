name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name "경고메시지" "경고메시지_프로그램.py"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: warning-message-windows-exe
          path: dist/경고메시지.exe
          if-no-files-found: error
          retention-days: 14
